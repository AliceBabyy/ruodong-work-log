{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-card">
    <h2 class="mb-4">{{ title }}</h2>
    <form method="post" action="{{ action }}">
        <div class="mb-3">
            <label class="form-label">开始时间</label>
            <input type="datetime-local" name="start_time" class="form-control" required
                   value="{{ log.start_time.strftime('%Y-%m-%dT%H:%M') if log else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">结束时间</label>
            <input type="datetime-local" name="end_time" class="form-control" required
                   value="{{ log.end_time.strftime('%Y-%m-%dT%H:%M') if log else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">放松方式</label>
            <input type="text" name="rest_way" class="form-control" required
                   placeholder="比如：散步、刷手机、午睡"
                   value="{{ log.rest_way if log else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">备注</label>
            <textarea name="remark" class="form-control">{{ log.remark if log and log.remark else '' }}</textarea>
        </div>
        <input type="hidden" name="return_date" value="{{ return_date }}">
        <button type="submit" class="btn btn-primary w-100">保存</button>
    </form>
</div>
{% endblock %}
